apiVersion: v1
kind: Secret
metadata:
  name: rpa-neo4j-secrets
  namespace: renovai-api
type: Opaque
stringData:
  PG_DSN: "host=HOST port=5432 dbname=renovai user=USUARIO_LEITURA password=SENHA sslmode=require"
  NEO4J_URI: "neo4j+s://HOST"
  NEO4J_USER: "USUARIO_ESCRITA"
  NEO4J_PASSWORD: "SENHA"
  NEO4J_DATABASE: "neo4j"
  NOMINATIM_USER_AGENT: "renovai-graph-sync (seu-email@exemplo.com)"
  RETREINAR_ROTAS_APOS_SYNC: "true"
