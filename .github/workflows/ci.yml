name: Validate RPA orchestration
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q rpa
      - run: python -m unittest discover -s tests -v
      - run: python -m rpa.sync.main --help
      - run: docker build -f orchestration/Dockerfile -t renovai-rpa-neo4j:ci .
      - run: docker run --rm renovai-rpa-neo4j:ci python -m rpa.sync.main --help
